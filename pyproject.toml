[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-harness"
version = "0.1.0"
description = "Deterministic Code-Graph Debugging & Mutation Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    "torch",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
harness = "code_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_harness"]
