[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debug-harness"
version = "0.2.0"
description = "Deterministic Code-Graph Debugging & Mutation Harness for Antigravity (AGY)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "harshgupta-23" }
]
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/harshgupta-23/debug-harness"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    "torch",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
harness = "code_harness.cli:app"
debug-harness = "code_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_harness"]
